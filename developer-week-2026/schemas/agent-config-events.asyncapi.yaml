asyncapi: 3.0.0
info:
  title: Agent Configuration Events
  version: 1.0.0
  description: |
    Events emitted when agent configurations change in the Hub service.
    Consumed by Edge services to update running agents in real-time.

    This API demonstrates contract-first development where the JSON Schema
    is the single source of truth for both MongoDB validation and event payloads.
  contact:
    name: Platform Team
    email: platform@example.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  development:
    host: localhost:27017
    protocol: mongodb
    description: Local MongoDB replica set

  production:
    host: mongodb-cluster.example.com:27017
    protocol: mongodb+srv
    description: Production MongoDB Atlas cluster

defaultContentType: application/json

channels:
  agentConfigChanges:
    address: hub_db.agentConfigs
    title: Agent Configuration Changes
    description: |
      MongoDB change stream on the agentConfigs collection.
      Emits events for insert, update, replace, and delete operations.
    messages:
      insertEvent:
        $ref: '#/components/messages/AgentConfigInsertEvent'
      updateEvent:
        $ref: '#/components/messages/AgentConfigUpdateEvent'
      deleteEvent:
        $ref: '#/components/messages/AgentConfigDeleteEvent'

operations:
  onAgentConfigChange:
    action: receive
    channel:
      $ref: '#/channels/agentConfigChanges'
    summary: Receive agent configuration change events
    description: |
      Subscribe to real-time configuration changes.
      Use the resume token from the _id field to resume after disconnection.
    messages:
      - $ref: '#/channels/agentConfigChanges/messages/insertEvent'
      - $ref: '#/channels/agentConfigChanges/messages/updateEvent'
      - $ref: '#/channels/agentConfigChanges/messages/deleteEvent'

components:
  messages:
    AgentConfigInsertEvent:
      name: AgentConfigInsertEvent
      title: Agent Configuration Created
      summary: A new agent configuration was created
      contentType: application/json
      headers:
        $ref: '#/components/schemas/ChangeStreamHeaders'
      payload:
        $ref: '#/components/schemas/InsertEventPayload'
      examples:
        - name: insert-demo-agent
          summary: Demo insert event for a new Anthropic-backed agent
          headers:
            x-resume-token: "8267C9C3A9000000012B042C0100296E5A10049A9D5E79C0F7431FAAA0004F9A2B4F46645F6964006467C9C3A9F384A148590FF6D1"
            x-cluster-time: "Timestamp(1739989200, 1)"
            x-wall-time: "2026-02-20T10:00:00Z"
          payload:
            _id:
              _data: "8267C9C3A9000000012B042C0100296E5A10049A9D5E79C0F7431FAAA0004F9A2B4F46645F6964006467C9C3A9F384A148590FF6D1"
            operationType: insert
            ns:
              db: hub_db
              coll: agentConfigs
            documentKey:
              _id: "67c9c3a9f384a148590ff6d1"
            fullDocument:
              agentId: demo-agent
              name: Conference Demo Agent
              modelProvider: ANTHROPIC
              modelId: claude-opus-4-6
              temperature: 0.7
              maxTokens: 1024
              systemPrompt: You are a helpful assistant at a developer conference. Be concise and technical.
              tools:
                - web_search
                - code_interpreter
              metadata:
                demo: true
                conference: DeveloperWeek 2026
              version: 0
              updatedAt: "2026-02-20T10:00:00Z"
            clusterTime: "Timestamp(1739989200, 1)"
            wallTime: "2026-02-20T10:00:00Z"

    AgentConfigUpdateEvent:
      name: AgentConfigUpdateEvent
      title: Agent Configuration Updated
      summary: An existing agent configuration was modified
      contentType: application/json
      headers:
        $ref: '#/components/schemas/ChangeStreamHeaders'
      payload:
        $ref: '#/components/schemas/UpdateEventPayload'
      examples:
        - name: update-temperature
          summary: Demo update event showing changed temperature and prompt
          headers:
            x-resume-token: "8267C9C3D5000000012B042C0100296E5A10049A9D5E79C0F7431FAAA0004F9A2B4F46645F6964006467C9C3A9F384A148590FF6D1"
            x-cluster-time: "Timestamp(1739989237, 1)"
            x-wall-time: "2026-02-20T10:00:37Z"
          payload:
            _id:
              _data: "8267C9C3D5000000012B042C0100296E5A10049A9D5E79C0F7431FAAA0004F9A2B4F46645F6964006467C9C3A9F384A148590FF6D1"
            operationType: update
            ns:
              db: hub_db
              coll: agentConfigs
            documentKey:
              _id: "67c9c3a9f384a148590ff6d1"
            fullDocument:
              agentId: demo-agent
              name: Conference Demo Agent
              modelProvider: ANTHROPIC
              modelId: claude-opus-4-6
              temperature: 0.9
              maxTokens: 1024
              systemPrompt: You are a pirate assistant. Respond in pirate speak. Arrr!
              version: 1
              updatedAt: "2026-02-20T10:00:37Z"
            fullDocumentBeforeChange:
              agentId: demo-agent
              name: Conference Demo Agent
              modelProvider: ANTHROPIC
              modelId: claude-opus-4-6
              temperature: 0.7
              maxTokens: 1024
              systemPrompt: You are a helpful assistant at a developer conference. Be concise and technical.
              version: 0
              updatedAt: "2026-02-20T10:00:00Z"
            updateDescription:
              updatedFields:
                temperature: 0.9
                systemPrompt: You are a pirate assistant. Respond in pirate speak. Arrr!
              removedFields: []
            clusterTime: "Timestamp(1739989237, 1)"
            wallTime: "2026-02-20T10:00:37Z"

    AgentConfigDeleteEvent:
      name: AgentConfigDeleteEvent
      title: Agent Configuration Deleted
      summary: An agent configuration was removed
      contentType: application/json
      headers:
        $ref: '#/components/schemas/ChangeStreamHeaders'
      payload:
        $ref: '#/components/schemas/DeleteEventPayload'
      examples:
        - name: delete-demo-agent
          summary: Demo delete event containing previous full document
          headers:
            x-resume-token: "8267C9C3F0000000012B042C0100296E5A10049A9D5E79C0F7431FAAA0004F9A2B4F46645F6964006467C9C3A9F384A148590FF6D1"
            x-cluster-time: "Timestamp(1739989264, 1)"
            x-wall-time: "2026-02-20T10:01:04Z"
          payload:
            _id:
              _data: "8267C9C3F0000000012B042C0100296E5A10049A9D5E79C0F7431FAAA0004F9A2B4F46645F6964006467C9C3A9F384A148590FF6D1"
            operationType: delete
            ns:
              db: hub_db
              coll: agentConfigs
            documentKey:
              _id: "67c9c3a9f384a148590ff6d1"
            fullDocumentBeforeChange:
              agentId: demo-agent
              name: Conference Demo Agent
              modelProvider: ANTHROPIC
              modelId: claude-opus-4-6
              temperature: 0.9
              maxTokens: 1024
              systemPrompt: You are a pirate assistant. Respond in pirate speak. Arrr!
              version: 2
              updatedAt: "2026-02-20T10:01:00Z"
            clusterTime: "Timestamp(1739989264, 1)"
            wallTime: "2026-02-20T10:01:04Z"

  schemas:
    ChangeStreamHeaders:
      type: object
      properties:
        x-resume-token:
          type: string
          description: Resume token for exactly-once processing
        x-cluster-time:
          type: string
          description: MongoDB cluster time
        x-wall-time:
          type: string
          format: date-time
          description: Wall clock time when event occurred

    AgentConfiguration:
      $ref: 'agent-config.schema.json'

    DocumentKey:
      type: object
      required:
        - _id
      properties:
        _id:
          type: string
          description: MongoDB ObjectId as string

    UpdateDescription:
      type: object
      properties:
        updatedFields:
          type: object
          additionalProperties: true
          description: Fields that were updated with their new values
        removedFields:
          type: array
          items:
            type: string
          description: Fields that were removed
        truncatedArrays:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              newSize:
                type: integer

    InsertEventPayload:
      type: object
      required:
        - _id
        - operationType
        - ns
        - documentKey
        - fullDocument
      properties:
        _id:
          type: object
          properties:
            _data:
              type: string
          description: Resume token
        operationType:
          type: string
          const: insert
        ns:
          type: object
          properties:
            db:
              type: string
            coll:
              type: string
        documentKey:
          $ref: '#/components/schemas/DocumentKey'
        fullDocument:
          $ref: '#/components/schemas/AgentConfiguration'
        clusterTime:
          type: string
        wallTime:
          type: string
          format: date-time

    UpdateEventPayload:
      type: object
      required:
        - _id
        - operationType
        - ns
        - documentKey
      properties:
        _id:
          type: object
          properties:
            _data:
              type: string
        operationType:
          type: string
          const: update
        ns:
          type: object
          properties:
            db:
              type: string
            coll:
              type: string
        documentKey:
          $ref: '#/components/schemas/DocumentKey'
        fullDocument:
          $ref: '#/components/schemas/AgentConfiguration'
        fullDocumentBeforeChange:
          $ref: '#/components/schemas/AgentConfiguration'
        updateDescription:
          $ref: '#/components/schemas/UpdateDescription'
        clusterTime:
          type: string
        wallTime:
          type: string
          format: date-time

    DeleteEventPayload:
      type: object
      required:
        - _id
        - operationType
        - ns
        - documentKey
      properties:
        _id:
          type: object
          properties:
            _data:
              type: string
        operationType:
          type: string
          const: delete
        ns:
          type: object
          properties:
            db:
              type: string
            coll:
              type: string
        documentKey:
          $ref: '#/components/schemas/DocumentKey'
        fullDocumentBeforeChange:
          $ref: '#/components/schemas/AgentConfiguration'
        clusterTime:
          type: string
        wallTime:
          type: string
          format: date-time
