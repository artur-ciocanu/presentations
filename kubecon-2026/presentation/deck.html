:root {
  --paper: #ffffff; --ink: #16161d; --muted: #4a4a57; --pen: #c0182b;
  /* the colour rule (DESIGN.md): blue = what the user said; pink = about mom; green = about me;
     grey = a memory record with no subject field; white = everything else. Yellow is only the quote highlighter. */
  --said: #b0dafc; --mom: #fbc4d8; --me: #b5efc0; --nosubject: #e4e4ea; --highlight: #fde99a;
  --mom-s: #d6336c; --me-s: #2f9e44;
  --h: 700 58px/1.12 "Inter", sans-serif;
  --body: 600 34px/1.3 "Inter", sans-serif;
  --mono: 400 26px/1.35 "JetBrains Mono", monospace;
  --label: 700 22px/1 "Inter", sans-serif;
  --pad-x: 96px; --pad-top: 64px; --pad-bottom: 60px;
  --border: 4px solid var(--ink);
  --radius: 16px;
}

/* ---------- base ---------- */
.reveal-viewport, body { background: var(--paper); }
.reveal { color: var(--ink); font-family: "Inter", sans-serif; }
.reveal .slides { text-align: left; }
section.slide { box-sizing: border-box; width: 1600px; height: 900px; padding: var(--pad-top) var(--pad-x) var(--pad-bottom) !important; flex-direction: column; color: var(--ink); }
.reveal .slides > section.slide.present, section.slide.standalone { display: flex !important; }
section.slide * { box-sizing: border-box; margin: 0; padding: 0; }
section.slide h1, section.slide h2 { font: var(--h); letter-spacing: -.015em; max-width: 1400px; color: var(--ink); text-transform: none; }
section.slide p, section.slide li { font: var(--body); }
section.slide code { font: inherit; font-family: "JetBrains Mono", monospace; font-size: .9em; }
section.slide strong { font-weight: 700; }
section.slide .pen { font: 700 32px/1.2 "Inter"; color: var(--pen); }
section.slide .source { margin-top: auto; font: 400 24px/1.3 "Inter"; color: var(--muted); }
section.slide .figure { flex: 1; min-height: 0; margin-top: 28px; }
section.slide .figure svg { width: 100%; height: 100%; display: block; }
section.slide .fragment { transition: none; }

/* ---------- records: shared by artifact and compare ---------- */
section.slide .rec { border: var(--border); border-radius: var(--radius); background: var(--paper); font: var(--mono); }
section.slide .rec b { display: flex; align-items: center; gap: 14px; font: 700 24px/1.2 "Inter"; margin-bottom: 14px; }
section.slide .rec.said { background: var(--said); }
section.slide .rec.mom { background: var(--mom); }
section.slide .rec.me { background: var(--me); }
section.slide .rec.nosubject { background: var(--nosubject); }
section.slide .rec.derived { border-style: dashed; }

/* operations: the verb, never colour alone */
section.slide .op { display: inline-block; font: 700 20px/1 "Inter"; letter-spacing: .1em; padding: 6px 12px; border: 3px solid var(--ink); border-radius: 8px; }
section.slide .op.write { background: var(--ink); color: var(--paper); }
section.slide .op.read { background: var(--paper); color: var(--ink); }
section.slide .op.delete { background: var(--pen); border-color: var(--pen); color: var(--paper); }

/* ---------- title ---------- */
section.title { justify-content: center; }
section.title h1 { font: 700 68px/1.1 "Inter"; letter-spacing: -.02em; max-width: 1408px; }
section.title .byline { margin-top: 48px; font: 600 34px/1.3 "Inter"; color: var(--muted); }

/* ---------- statement: one message or one sentence, nothing else ---------- */
section.statement { justify-content: center; }
section.statement .who { font: 600 28px/1 "Inter"; color: var(--muted); margin-bottom: 22px; }
section.statement .bubble { background: var(--said); border: var(--border); border-radius: 30px 30px 30px 6px; padding: 44px 56px; font: 700 58px/1.32 "Inter"; letter-spacing: -.01em; max-width: 1340px; }
section.statement mark { background: none; color: inherit; border-bottom: 8px solid var(--c); white-space: nowrap; }
section.statement mark sup { font: 700 30px/1 "Inter"; margin-left: 4px; vertical-align: super; }
section.statement ol { list-style: none; display: flex; gap: 40px; margin-top: 56px; }
section.statement ol li { font: 600 38px/1.25 "Inter"; display: flex; gap: 18px; align-items: baseline; flex: 1; }
section.statement ol li b { font: 700 30px/1 "Inter"; background: var(--f); border: 3px solid var(--ink); border-radius: 50%; width: 50px; height: 50px; display: inline-grid; place-items: center; flex: none; }
section.statement .mom { --c: var(--mom-s); --f: var(--mom); }
section.statement .me { --c: var(--me-s); --f: var(--me); }
section.statement .claim { font: 700 84px/1.12 "Inter"; letter-spacing: -.02em; max-width: 1380px; }
section.statement .claim + .claim { margin-top: 36px; }

/* ---------- quote: a vendor's own words, verbatim, with the source ---------- */
section.quote blockquote { margin-top: 40px; border-left: 10px solid var(--ink); padding: 8px 0 8px 40px; font: 600 44px/1.3 "Inter"; max-width: 1340px; }
section.quote blockquote + blockquote { margin-top: 28px; }
section.quote blockquote mark { background: var(--highlight); color: inherit; padding: 0 6px; }

/* ---------- artifact: what a system actually stored or replied, verbatim ---------- */
section.artifact .rec { margin-top: 32px; padding: 28px 34px; font-size: 34px; max-width: 1408px; }
section.artifact .rec + .rec { margin-top: 20px; }
section.artifact .rec.compact { font-size: 30px; padding: 20px 30px; }
section.artifact .pen { margin-top: 22px; font-size: 34px; }
section.artifact .fields { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 14px; margin-top: 26px; }
section.artifact .fields code { font: var(--mono); font-size: 30px; border: 3px solid var(--ink); border-radius: 10px; padding: 4px 14px; }
section.artifact .fields code.missing { border-style: dashed; border-color: var(--pen); color: var(--pen); }
section.artifact .cols { display: grid; grid-template-columns: 1.5fr 1fr 1fr; gap: 40px; margin-top: 32px; align-items: start; }
section.artifact .cols h3 { font: var(--label); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 16px; }
section.artifact .cols .rec { margin-top: 0; font-size: 28px; }
section.artifact .fields.stack { flex-direction: column; align-items: flex-start; flex-wrap: nowrap; margin-top: 0; }
section.artifact table { margin-top: 36px; border-collapse: separate; border-spacing: 0; border: var(--border); border-radius: var(--radius); overflow: hidden; width: 100%; }
section.artifact th { white-space: nowrap; font: var(--label); letter-spacing: .06em; text-transform: uppercase; text-align: left; padding: 20px 24px; background: var(--ink); color: var(--paper); }
section.artifact td { font: var(--mono); font-size: 34px; padding: 26px 24px; white-space: nowrap; border-top: 3px solid var(--ink); }
section.artifact tr.mom td { background: var(--mom); }
section.artifact tr.me td { background: var(--me); }
section.artifact tr.absent td { background: var(--paper); color: var(--muted); text-decoration: line-through; text-decoration-color: var(--pen); text-decoration-thickness: 4px; }
section.artifact table.wide td { font-size: 29px; padding: 24px 18px; }
section.artifact table.wide th { padding: 18px 18px; }

/* ---------- diagram: hand-authored SVG, at least half the slide ---------- */
section.diagram .figure { margin-top: 24px; }
.figure svg .box { stroke: var(--ink); stroke-width: 4; stroke-linejoin: round; fill: var(--paper); }
.figure svg .box.dash { stroke-dasharray: 14 10; }
.figure svg .box.said { fill: var(--said); } .figure svg .box.mom { fill: var(--mom); }
.figure svg .box.me { fill: var(--me); } .figure svg .box.nosubject { fill: var(--nosubject); }
.figure svg .lbl { font: 700 24px "Inter"; fill: var(--ink); }
.figure svg .t { font: 600 32px "Inter"; fill: var(--ink); }
.figure svg .t-big { font: 700 40px "Inter"; fill: var(--ink); }
.figure svg .m { font: 400 26px "JetBrains Mono"; fill: var(--ink); }
.figure svg .tag { font: 400 24px "JetBrains Mono"; fill: var(--ink); }
.figure svg .pen { font: 700 28px "Inter"; fill: var(--pen); }
.figure svg .line { stroke: var(--ink); stroke-width: 3.5; fill: none; }
.figure svg .head { fill: var(--ink); }
.figure svg .op-delete { fill: var(--pen); }
.figure svg .op-text { font: 700 20px "Inter"; letter-spacing: .1em; fill: var(--paper); }

/* ---------- compare: verbatim records side by side, or a two-column contrast of terms ---------- */
section.compare .cols { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 36px; margin-top: 36px; flex: 1; min-height: 0; }
section.compare .col h3 { font: 700 40px/1 "Inter"; margin-bottom: 18px; }
section.compare .rec { padding: 18px 22px; font-size: 24px; line-height: 1.3; margin-bottom: 14px; }
section.compare .rec b { font-size: 20px; margin-bottom: 10px; }
section.compare .col .pen { margin-top: 4px; font-size: 28px; }
section.compare table { margin-top: 36px; width: 100%; border-collapse: collapse; }
section.compare th { font: 700 28px/1 "Inter"; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); text-align: left; padding: 0 32px 24px 0; }
section.compare td { font: 400 46px/1.2 "Inter"; padding: 30px 32px 30px 0; border-top: 3px solid var(--ink); width: 50%; }
section.compare td + td { font-weight: 700; }
section.compare table.dense td { font-size: 38px; padding: 20px 32px 20px 0; }

/* ---------- end: references, links, QR ---------- */
section.end h2 { font-size: 48px; }
section.end ol { margin-top: 28px; padding-left: 1.4em; columns: 2; column-gap: 64px; }
section.end ol li { font: 400 22px/1.35 "Inter"; margin-bottom: 10px; break-inside: avoid; }
section.end .qr { display: grid; grid-template-columns: 1fr 460px; gap: 64px; align-items: center; flex: 1; }
section.end a { color: var(--ink); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
section.end .qr img { width: 460px; height: 460px; background: #fff; border: 0; margin: 0; image-rendering: pixelated; }
section.end .qr p { font: 600 40px/1.3 "Inter"; }
section.end .qr p + p { margin-top: 28px; }

<!-- .slide: id="title" class="slide title" -->

<h1>I Rebuilt Agent Memory Three Times. The Third Time I Treated It Like Data.</h1>
<p class="byline">Artur Ciocanu · KubeCon 2026</p>

---

<!-- .slide: id="flight" class="slide statement" -->

<p class="who">A user, to a travel assistant</p>
<p class="bubble">I'm booking a long flight for me and <mark class="mom">my mom. She has diabetes.<sup>1</sup></mark> I want to <mark class="me">avoid<sup>2</sup></mark> anything with <mark class="me">cinnamon.<sup>3</sup></mark></p>
<ol>
<li class="mom fragment"><b>1</b>Whose diabetes?</li>
<li class="me fragment"><b>2</b>A preference, or an allergy?</li>
<li class="me fragment"><b>3</b>And when I say it's fine now?</li>
</ol>

---

<!-- .slide: id="mem0-convention" class="slide quote" -->

<h2>Mem0 documents its memory types as conventions over shared primitives.</h2>
<blockquote>None of these three types has its own dedicated parameter in Mem0: not semantic, not episodic, not procedural.</blockquote>
<blockquote>All three are Mem0's same <code>add()</code>/<code>search()</code> primitives, <mark>differentiated by convention</mark> …</blockquote>
<p class="source">Mem0, “Semantic vs Episodic vs Procedural Memory in AI Agents”</p>

---

<!-- .slide: id="human-vs-agent" class="slide compare" -->

<h2>Human memory has the opposite requirements from what an agent's knowledge needs.</h2>
<table>
<thead><tr><th>Human memory is</th><th>Agent knowledge has to be</th></tr></thead>
<tbody>
<tr><td>reconstructive</td><td>authoritative</td></tr>
<tr><td>lossy</td><td>versioned</td></tr>
<tr><td>subjective</td><td>consistent</td></tr>
<tr><td>tolerant of contradiction</td><td>able to detect conflicts</td></tr>
</tbody>
</table>

---

<!-- .slide: id="mem0-stored" class="slide artifact" -->

<h2>In one Mem0 run, the subject was described in the stored text.</h2>
<div class="cols">
<div>
<h3>Stored memory</h3>
<div class="rec nosubject"><b><span class="op write">WRITE</span>add() · the stored memory</b>User is booking a long flight with their mother, who has diabetes, and wants to avoid in-flight food containing cinnamon.</div>
</div>
<div>
<h3>Mem0's fields</h3>
<div class="fields stack"><code>id</code><code>memory</code><code>hash</code><code>metadata</code><code>created_at</code><code>updated_at</code><code>user_id</code><code>attributed_to</code></div>
</div>
<div>
<h3>Fields not returned</h3>
<div class="fields stack"><code class="missing">about whom</code><code class="missing">stated or inferred</code><code class="missing">valid until</code></div>
</div>
</div>

---

<!-- .slide: id="mem0-recall" class="slide artifact" -->

<h2>In three Mem0 runs, a search for Artur's diabetes returned his mother's diabetes first.</h2>
<div class="rec"><b><span class="op read">READ</span>search() · filters={"user_id": "artur"}</b>Does Artur have diabetes?</div>
<div class="rec nosubject"><b>Result #1 in runs 1, 2 and 3 · run 1 shown</b>User is booking a long flight with their mother, who has diabetes, and wants to avoid in-flight food containing cinnamon.</div>

---

<!-- .slide: id="mem0-failures" class="slide compare" -->

<h2>Three observations from the Mem0 runs.</h2>
<table class="dense">
<thead><tr><th>Result · 3 runs</th><th>What the returned data showed</th></tr></thead>
<tbody>
<tr><td>“Does Artur have diabetes?” returned mom's diabetes first, 3&nbsp;of&nbsp;3</td><td>The returned records had no separate subject field.</td></tr>
<tr><td>“What do we know about Artur's mom?” missed her diabetes memory, 3&nbsp;of&nbsp;3</td><td>The search did not return that memory.</td></tr>
<tr><td>“Cinnamon is fine now”: both versions kept, 3&nbsp;of&nbsp;3</td><td>The correction was added; the original remained.</td></tr>
</tbody>
</table>

---

<!-- .slide: id="letta-dreaming" class="slide quote" -->

<h2>In Letta, the agent decides what to keep, and a background job “dreams” on it.</h2>
<blockquote>The agent decides where the lesson belongs and commits the update to MemFS.</blockquote>
<blockquote><mark>Dreaming</mark> uses background subagents to review recent conversations, consolidate useful lessons, and update memory …</blockquote>
<blockquote>… does not ask you for approval.</blockquote>
<p class="source">Letta docs, “Memory &amp; dreaming”</p>

---

<!-- .slide: id="understood" class="slide artifact" -->

<h2>In the Letta V1 runs, a request to forget left the message in the history.</h2>
<div class="rec said"><b>User</b>Please don't keep anything about my mom's health.</div>
<div class="rec fragment"><b>Agent · Letta</b>Understood. I won't retain or use your mom's health information going forward.</div>
<div class="rec said fragment"><b>Still in the conversation history · all three V1 runs</b>I'm booking a long flight for me and my mom. She has diabetes. I want to avoid anything with cinnamon.</div>

---

<!-- .slide: id="letta-failures" class="slide compare" -->

<h2>Across six Letta runs, curated memory and conversation history behaved differently.</h2>
<table class="dense">
<thead><tr><th>Observation · 6 runs, two generations</th><th>What we saw</th></tr></thead>
<tbody>
<tr><td>No fact went into curated memory, 6&nbsp;of&nbsp;6</td><td>The tested agents did not add these facts to curated memory.</td></tr>
<tr><td>A reply said “cinnamon allergy or sensitivity”, 1&nbsp;of&nbsp;3 (older server)</td><td>The input did not state an allergy or sensitivity.</td></tr>
<tr><td>“Don't keep” (older server): no call, three failed edits, a policy note</td><td>No message deletion was observed in the V1 runs.</td></tr>
<tr><td>The message stayed in history, 6&nbsp;of&nbsp;6</td><td>It was present in the snapshots taken after the request.</td></tr>
</tbody>
</table>

---

<!-- .slide: id="forgetting" class="slide statement" -->

<p class="claim">“Understood” is a sentence.</p>
<p class="claim">Forgetting is a data operation someone owns.</p>

---

<!-- .slide: id="records" class="slide artifact" -->

<h2>The missing answers are columns: about whom, stated or inferred, and until when.</h2>
<table>
<thead><tr><th>About whom</th><th>Fact</th><th>Category</th><th>Stated / inferred</th><th>Valid until</th></tr></thead>
<tbody>
<tr class="mom fragment"><td>Artur's<br>mom</td><td>has diabetes</td><td>health</td><td>stated</td><td>open</td></tr>
<tr class="me fragment"><td>Artur</td><td>avoid cinnamon</td><td>food_preference</td><td>stated</td><td>open</td></tr>
<tr class="absent fragment"><td>Artur</td><td>cinnamon allergy</td><td>health</td><td>inferred</td><td>—</td></tr>
</tbody>
</table>
<p class="pen fragment">No allergy record: I never said allergy.</p>

---

<!-- .slide: id="translation" class="slide compare" -->

<h2>Memory concepts can be described in data terms.</h2>
<table class="dense">
<thead><tr><th>Memory concept</th><th>In data terms</th></tr></thead>
<tbody>
<tr><td>episodic memory</td><td>events: what happened, and when</td></tr>
<tr><td>semantic memory</td><td>the user profile: facts about a subject, valid from / to</td></tr>
<tr><td>procedural memory</td><td>skills, like a SKILL.md: instructions, versioned like code</td></tr>
<tr><td>dreaming</td><td>a scheduled consolidation job, which needs lineage</td></tr>
</tbody>
</table>

<h2>My guardrails add the facets where loose is dangerous.</h2>

  <desc id="guard-d">1, a controlled vocabulary for subject and category. 2, applied as tags on every retain. 3, deterministic extraction in code wherever possible. 4, consolidation off.</desc>

  </defs>
  <rect class="box" x="4" y="4" width="684" height="270" rx="16"/>
  <text class="lbl" x="34" y="50">1 · Controlled vocabulary</text>
  <text class="t" x="34" y="120">Subject: user, family_member</text>
  <text class="t" x="34" y="176">Category: health,</text>
  <text class="t" x="34" y="220">food_preference</text>
  <rect class="box" x="720" y="4" width="684" height="270" rx="16"/>

  <rect class="box" x="4" y="312" width="684" height="270" rx="16"/>

  <rect class="box" x="720" y="312" width="684" height="270" rx="16"/>
  <text class="lbl" x="750" y="358">4 · Consolidation off</text>

<!-- .slide: id="five-fields" class="slide compare" -->

<h2>Enterprise memory needs five fields that answer what the agent can't guess.</h2>
<table class="dense">
<thead><tr><th>Field</th><th>The question it answers</th></tr></thead>
<tbody>
<tr><td>about whom</td><td>Whose diabetes is it?</td></tr>
<tr><td>who said it · stated or inferred</td><td>Did anyone say “allergy”?</td></tr>
<tr><td>when we learned it</td><td>When, and from which message?</td></tr>
<tr><td>valid from · valid to (SCD Type 2)</td><td>Is it still true? Old row closed, new row current.</td></tr>
<tr><td>derived from</td><td>What goes when the source goes?</td></tr>
</tbody>
</table>

  <script>async function startDeck() {
  const staticReview = new URLSearchParams(location.search).has('static');
  let assetError;
  const assets = {
    id: 'deck-assets',
    async init(deck) {
      try {
        const sections = Array.from(deck.getRevealElement().querySelectorAll('.slides > section'));
        sections.forEach((section, index) => {
          if (section.classList.contains('title')) return;
          const footer = document.createElement('div');
          footer.className = 'footer';
          const left = document.createElement('span');
          left.textContent = 'Artur Ciocanu · KubeCon 2026';
          const right = document.createElement('span');
          right.textContent = String(index + 1).padStart(2, '0');
          footer.append(left, right);
          section.append(footer);
        });
        await Promise.all(Array.from(document.querySelectorAll('[data-svg]')).map(async holder => {
          const response = await fetch(holder.dataset.svg);
          if (!response.ok) throw new Error(`Unable to load ${holder.dataset.svg}: ${response.status}`);
          const xml = new DOMParser().parseFromString(await response.text(), 'image/svg+xml');
          if (xml.querySelector('parsererror')) throw new Error(`Invalid SVG: ${holder.dataset.svg}`);
          holder.replaceChildren(document.importNode(xml.documentElement, true));
        }));
        await document.fonts.ready;
      } catch (error) { assetError = error; }
    }
  };
  await Reveal.initialize({
    width: 1600, height: 900, margin: 0, center: false,
    hash: true, hashOneBasedIndex: false,
    controls: false, controlsTutorial: false, progress: true,
    fragments: !staticReview, slideNumber: false,
    transition: 'none', backgroundTransition: 'none', navigationMode: 'linear',
    plugins: [RevealMarkdown, assets, RevealNotes]
  });
  if (assetError) throw assetError;
  await document.fonts.ready;
  window.deckReady = true;
}
startDeck().catch(error => {
  console.error(error);
  const alert = document.getElementById('load-error');
  alert.textContent = `${error.message}. Serve the presentation directory over HTTP (python3 -m http.server).`;
  alert.hidden = false;
});
</script>
